spring.application.name=visitors

# Render provides PORT automatically. The fallback keeps the usual local port.
server.port=${PORT:8080}
server.address=0.0.0.0

# Set these three values in Render's Environment page. Do not commit database
# passwords to GitHub.
spring.datasource.url=${SPRING_DATASOURCE_URL}
spring.datasource.username=${SPRING_DATASOURCE_USERNAME}
spring.datasource.password=${SPRING_DATASOURCE_PASSWORD}
spring.jpa.hibernate.ddl-auto=update

spring.jpa.show-sql=false
spring.jpa.open-in-view=false

# Comma-separated frontend addresses allowed to call this API.
app.cors.allowed-origins=${FRONTEND_URL:http://localhost:5173}
